<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phrase Search | Avar–English Dictionary | en.avar.me</title>
    <meta name="description" content="Full-text search across example phrases and translations in the Avar–English and English–Avar dictionary.">
    <meta name="keywords" content="Avar phrases, Avar examples, Avar dictionary, English Avar translation, Avar language, Dagestan">
    <meta name="author" content="avar.me">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://en.avar.me/phrases.html">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://en.avar.me/phrases.html">
    <meta property="og:title" content="Phrase Search | Avar–English Dictionary">
    <meta property="og:description" content="Full-text search across example phrases and translations in the Avar–English dictionary.">
    <meta property="og:image" content="https://en.avar.me/og-image.jpg">
    <meta property="og:locale" content="en_US">
    <meta property="og:site_name" content="en.avar.me">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Phrase Search | Avar–English Dictionary">
    <meta name="twitter:description" content="Full-text search across example phrases and translations in the Avar–English dictionary.">
    <meta name="twitter:image" content="https://en.avar.me/og-image.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css?v=__ASSET_VERSION__">
    <link rel="icon" type="image/png" href="avar.me.png">
    <link rel="apple-touch-icon" href="avar.me.png">
</head>
<body>
    <div class="bg-pattern" aria-hidden="true"></div>

    <div class="container">
        <header class="header">
            <p class="header-tag"><a href="index.html">en.avar.me</a></p>
            <h1 class="title">Phrase<br><span class="dot">Search</span></h1>
            <p class="phrases-subtitle">Searches inside example phrases and translations — not just headwords</p>
            <nav class="site-nav" aria-label="Site">
                <a href="index.html">Dictionary</a>
                <a href="phrases.html" class="active">Phrases</a>
                <a href="alphabet.html">Alphabet</a>
                <a href="about.html">About</a>
            </nav>
        </header>

        <div class="search-section">
            <div class="search-container">
                <div class="search-input-wrapper">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                        <path d="M9 17A8 8 0 1 0 9 1a8 8 0 0 0 0 16zM19 19l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <input
                        type="text"
                        id="phraseSearchInput"
                        class="search-input"
                        placeholder="Word or part of a phrase…"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                        autofocus
                    >
                    <button id="phraseClearBtn" class="clear-btn" type="button" aria-label="Clear">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                            <path d="M12 4L4 12M4 4l8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div id="phraseStats" class="search-stats"></div>
        </div>

        <div id="phraseResults" class="phrase-results">
            <section class="phrase-section" id="sectionAvEn">
                <h2 class="phrase-section-title">Avar → English</h2>
                <div id="tableAvEn" class="phrase-table-wrap"></div>
            </section>
            <section class="phrase-section" id="sectionEnAv">
                <h2 class="phrase-section-title">English → Avar</h2>
                <div id="tableEnAv" class="phrase-table-wrap"></div>
            </section>
        </div>

        <div id="phraseLoading" class="loading">
            <div class="spinner"></div>
            <p>Loading phrases…</p>
        </div>

        <div id="phraseError" class="error-message"></div>

        <footer class="footer">
            <p>
                <a href="index.html">← Dictionary</a>
            </p>
            <p>
                Based on the work of <a href="https://cg.avar.me" target="_blank" rel="noopener">Cyril Graham</a>
                · <a href="mailto:admin@avar.me">admin@avar.me</a>
            </p>
            <p>
                <a href="https://avar.me" target="_blank" rel="noopener">avar.me</a>
                · <a href="https://github.com/avar-me" target="_blank" rel="noopener">github.com/avar-me</a>
            </p>
        </footer>
    </div>

    <script>window.__DICT_ASSET_V__ = "__ASSET_VERSION__";</script>
    <script src="phrases.js?v=__ASSET_VERSION__" charset="utf-8"></script>
</body>
</html>
